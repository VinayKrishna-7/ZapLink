name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: linkforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/linkforge_test?schema=public"

      - name: Run Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/linkforge_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci_test_secret_key_32bytes"

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/linkforge_test?schema=public"
          NEXTAUTH_SECRET: "ci_test_secret_key_32bytes"
          NEXT_PUBLIC_APP_URL: "https://linkforge.app"
